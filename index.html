<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avis - Es Kristal Purbalingga Wetan</title>
    <script>
      // Safeguard to prevent crashes from third-party polyfills attempting to overwrite window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              writable: true,
              value: originalFetch
            });
          }
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            var protoFetch = window.fetch;
            Object.defineProperty(proto, 'fetch', {
              get: function() { return protoFetch; },
              set: function(val) { protoFetch = val; },
              configurable: true
            });
          } catch (err) {
            console.warn('Fetch safeguard failed to apply on prototype:', err);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
